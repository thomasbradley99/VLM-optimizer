<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="900" height="282" fill="#0d1117"/><text x="48" y="28" font-size="15" font-weight="600" fill="#ffffff">Where the pipeline actually fails</text><text x="48" y="47" font-size="12" fill="#c3c2b7">Best run (iter 023), each rung adding one more thing the model has to get right.</text><text x="144" y="95" font-size="13" text-anchor="end" fill="#ffffff">time only</text><rect x="156" y="74" width="536.0" height="34" rx="4" fill="#3987e5"/><text x="704.0" y="95" font-size="13" font-weight="600" fill="#ffffff">0.655</text><text x="752.0" y="95" font-size="11" fill="#c3c2b7">424 of 550</text><text x="144" y="137" font-size="13" text-anchor="end" fill="#ffffff">and type</text><rect x="156" y="116" width="378.9" height="34" rx="4" fill="#3987e5"/><text x="546.9" y="137" font-size="13" font-weight="600" fill="#ffffff">0.463</text><text x="594.9" y="137" font-size="11" fill="#c3c2b7">300 of 550</text><text x="144" y="179" font-size="13" text-anchor="end" fill="#ffffff">and team</text><rect x="156" y="158" width="306.1" height="34" rx="4" fill="#3987e5"/><text x="474.1" y="179" font-size="13" font-weight="600" fill="#ffffff">0.374</text><text x="522.1" y="179" font-size="11" fill="#c3c2b7">242 of 550</text><text x="144" y="221" font-size="13" text-anchor="end" fill="#ffffff">and number</text><rect x="156" y="200" width="23.7" height="34" rx="4" fill="#3987e5"/><text x="191.7" y="221" font-size="13" font-weight="600" fill="#ffffff">0.029</text><text x="239.7" y="221" font-size="11" fill="#c3c2b7">19 of 550</text><text x="48" y="268" font-size="11" fill="#c3c2b7">It finds the events. It cannot read the jersey.</text></svg>